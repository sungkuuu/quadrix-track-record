name: anchor-decision

# Anchors one decision document by hand, with the same KEEPER_PK secret the
# nightly run uses — the key never has to exist on a local machine.
# Run it from the Actions tab: pick this workflow, press "Run workflow",
# and give the path of the decision file.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Decision file (repo-relative path)'
        required: true
        default: 'trackrecord/decisions/2026-09-01-n1q-live-inception.md'

permissions:
  contents: write # appends trackrecord/decisions.jsonl to main

concurrency:
  group: keeper-key
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      # main as it is when this run STARTS, not the commit the run was created at: a run that waited in the
      # keeper-key queue behind another anchor must see that anchor's ledger line (red team F08). Dispatch the
      # next anchor only after the previous run's "decisions: anchor …" commit is on main; never "Re-run jobs".
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Anchor the decision
        run: node scripts/anchor-decision.mjs "${{ inputs.file }}"
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: Commit the anchor record
        run: |
          git config user.name "qx-track-record"
          git config user.email "keeper@quadrix.finance"
          git add trackrecord/decisions.jsonl
          git diff --cached --quiet || git commit -m "decisions: anchor ${{ inputs.file }}"
          # Rebase on main and push, up to five tries. Another commit can land on
          # main between checkout and push (ots is outside the keeper-key group;
          # basket-reconstitution and hand pushes also write to main), and a plain
          # push is then rejected and the record is lost. A rebase conflict means
          # another commit changed the same file: stop and fail, never resolve it
          # automatically and never force-push. An append-only file that only this
          # workflow appends to rebases cleanly, with its lines and their order
          # unchanged; two appends at the end of the same file conflict and fail.
          # A tracked file changed but not committed would also stop the rebase,
          # so it is checked first and reported as what it is.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::tracked files changed but not committed — the rebase cannot run. Stage them in this step. Nothing was pushed."
            git status --short --untracked-files=no
            git show --format='%H %s' HEAD -- trackrecord/decisions.jsonl
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "::warning::fetch attempt $i of 5 failed — trying again"
              sleep $((i * 5))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto main conflicted — another commit changed the same file. Nothing was pushed and nothing was overwritten. The local commit is printed below; apply it on main by hand."
              git show --format='%H %s' HEAD -- trackrecord/decisions.jsonl
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "::warning::push attempt $i of 5 rejected — trying again"
            sleep $((i * 5))
          done
          echo "::error::the anchor record could not be pushed to main after five tries. The local commit is printed below; apply it on main by hand."
          git show --format='%H %s' HEAD -- trackrecord/decisions.jsonl
          exit 1
