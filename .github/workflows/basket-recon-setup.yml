name: basket-recon-setup

# The two owner-key preparations of a basket reconstitution, by hand from the
# Actions tab. Never scheduled.
#
#   set-bidder    keeper/set-bidder.mjs — setBidder(<BIDDER_PK's address>, true)
#                 on every basket vault the rulebooks name; each tx is
#                 appended to keeper/bidder-log.jsonl (the setter emits no
#                 event). Needs the BIDDER_PK secret (or the bidder input).
#   deploy-mocks  keeper/deploy-mocks.mjs — one MockConstituent per entering
#                 name and basket, from the pending-registry files of `date`;
#                 writes keeper/mocks/{date}.json, the plan stage's `mocks`.
#                 The bidder (BIDDER_PK's address, else the keeper) receives
#                 the inventory the auctions sell into the vault — so run
#                 set-bidder first when a separate bidder is used.
#
# DRY RUN BY DEFAULT: nothing is sent unless `live` is ticked AND `confirm`
# is the word EXECUTE. The keeper key (KEEPER_PK) is the owner and deployer
# of the six testnet vaults. Same `keeper-key` concurrency group as every
# other workflow that signs with it. Inputs reach the shell through `env:`
# and are quoted — never interpolated into a `run:` line.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'set-bidder | deploy-mocks'
        required: true
        type: choice
        options: [set-bidder, deploy-mocks]
      live:
        description: 'Send transactions (otherwise dry run). Also needs confirm = EXECUTE.'
        type: boolean
        default: false
      confirm:
        description: 'Type EXECUTE to allow a live run'
        required: false
        default: ''
      date:
        description: 'deploy-mocks: the pending-registry date, YYYY-MM-DD (empty = today, UTC)'
        required: false
        default: ''
      indexes:
        description: 'Comma-separated subset, e.g. qrev,qai (empty = deploy-mocks: every index with a work order that day; set-bidder: all six vaults)'
        required: false
        default: ''
      bidder:
        description: 'set-bidder: bidder address (empty = the address of the BIDDER_PK secret)'
        required: false
        default: ''
      desk:
        description: 'deploy-mocks: optional desk address to seed with 100,000 shares of the new mocks (empty = none; the desk tops up from the open faucet)'
        required: false
        default: ''
      rpc:
        description: 'JSON-RPC endpoint'
        required: false
        default: 'https://sepolia-rpc.giwa.io'

permissions:
  contents: write # commits keeper/mocks/** and keeper/bidder-log.jsonl to main

concurrency:
  group: keeper-key
  cancel-in-progress: false

env:
  TASK: ${{ inputs.task }}
  DATE_IN: ${{ inputs.date }}
  INDEXES_IN: ${{ inputs.indexes }}
  BIDDER_IN: ${{ inputs.bidder }}
  DESK_IN: ${{ inputs.desk }}
  RPC: ${{ inputs.rpc }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      # The mocks file and the bidder log written by a live run are committed
      # to main; a run dispatched on another ref would push that ref's commits
      # to main. Main only, and main as it is when the job starts.
      - name: Run only on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::basket-recon-setup runs only on main (dispatched on $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide dry run or live
        id: mode
        env:
          LIVE: ${{ inputs.live }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$LIVE" = "true" ] && [ "$CONFIRM" = "EXECUTE" ]; then
            echo "flag=--live" >> "$GITHUB_OUTPUT"
            echo "::notice::LIVE — transactions will be sent from the keeper key"
          elif [ "$LIVE" = "true" ]; then
            echo "::error::live was ticked but confirm is not EXECUTE — refusing rather than running live by accident"
            exit 1
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN — nothing is sent"
          fi

      - name: ${{ inputs.task }}
        env:
          MODE_FLAG: ${{ steps.mode.outputs.flag }}
          # Present in every run so a dry run simulates from the address a
          # live run would sign with; the scripts never print a key.
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          BIDDER_PK: ${{ secrets.BIDDER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -o pipefail
          args=(--rpc "$RPC")
          [ -n "$INDEXES_IN" ] && args+=(--index "$INDEXES_IN")
          if [ "$TASK" = "set-bidder" ]; then
            [ -n "$BIDDER_IN" ] && args+=(--bidder "$BIDDER_IN")
            node keeper/set-bidder.mjs "${args[@]}" $MODE_FLAG 2>&1 | tee setup.log
          else
            d="${DATE_IN:-$(date -u +%Y-%m-%d)}"
            args+=(--date "$d")
            [ -n "$DESK_IN" ] && args+=(--desk "$DESK_IN")
            node keeper/deploy-mocks.mjs "${args[@]}" $MODE_FLAG 2>&1 | tee setup.log
          fi

      - name: Commit the mocks file and the bidder log
        # Runs even after a failed step: a deployment or a setBidder that was
        # mined must reach main (both scripts write after every transaction).
        if: ${{ !cancelled() }}
        run: |
          git config user.name "qx-basket-recon"
          git config user.email "keeper@quadrix.finance"
          for p in keeper/mocks keeper/bidder-log.jsonl; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet || git commit -m "basket-recon-setup: $TASK $(date -u +%Y-%m-%d)"
          # Rebase on main and push, up to five tries. Another commit can land on
          # main between checkout and push (ots is outside the keeper-key group;
          # basket-reconstitution and hand pushes also write to main), and a plain
          # push is then rejected and the record is lost. A rebase conflict means
          # another commit changed the same file: stop and fail, never resolve it
          # automatically and never force-push. An append-only file that only this
          # workflow appends to rebases cleanly, with its lines and their order
          # unchanged; two appends at the end of the same file conflict and fail.
          # A tracked file changed but not committed would also stop the rebase,
          # so it is checked first and reported as what it is.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::tracked files changed but not committed — the rebase cannot run. Stage them in this step. Nothing was pushed."
            git status --short --untracked-files=no
            git show --format='%H %s' HEAD -- keeper/mocks keeper/bidder-log.jsonl
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "::warning::fetch attempt $i of 5 failed — trying again"
              sleep $((i * 5))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto main conflicted — another commit changed the same file. Nothing was pushed and nothing was overwritten. The local commit is printed below; apply it on main by hand."
              git show --format='%H %s' HEAD -- keeper/mocks keeper/bidder-log.jsonl
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "::warning::push attempt $i of 5 rejected — trying again"
            sleep $((i * 5))
          done
          echo "::error::the mocks file and the bidder log could not be pushed to main after five tries. The local commit is printed below; apply it on main by hand."
          git show --format='%H %s' HEAD -- keeper/mocks keeper/bidder-log.jsonl
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          MODE_LABEL: ${{ steps.mode.outputs.flag == '--live' && 'LIVE' || 'dry run' }}
        run: |
          {
            echo "## basket-recon-setup — $TASK · $MODE_LABEL"
            echo
            echo '```'
            tail -n 60 setup.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
