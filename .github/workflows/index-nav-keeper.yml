name: index-nav-keeper

# Moved here from the private application repo on 2026-08-21. The keeper is a
# public-evidence job — the NAV it posts is checkable on chain by anyone — so it
# belongs in a public repository, where Actions minutes are free and unmetered.
# In the private repo one unrelated project exhausted the shared quota and
# silently froze this.

on:
  schedule:
    - cron: '17 */6 * * *' # scheduled every 6h — qX20 NAV mark on GIWA Sepolia; GitHub starts it late (observed 0.1–13.8h between marks)
  workflow_dispatch:
    inputs:
      acknowledge_move:
        description: 'Operator override: post the NAV even if it exceeds the sanity threshold. Requires a RUNBOOK entry.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: keeper-key
  cancel-in-progress: false

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at run start, not the commit the schedule queued on: a
          # queued run can start hours later, after other commits.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Post NAV
        id: post
        run: |
          set -o pipefail
          node keeper/update-nav.mjs 2>&1 | tee keeper.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          KEEPER_ACK_MOVE: ${{ inputs.acknowledge_move }}

      # QBV v3 streaming-fee poke. The fee is lazy (a missed run settles
      # exactly on the next), so this is deliberately non-fatal: it must never
      # block the NAV mark above.
      - name: Accrue QBV management fee
        continue-on-error: true
        run: node keeper/accrue-qbv-fee.mjs
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      # state.json carries the model book forward; nav-marks.jsonl is the
      # append-only record of what was actually posted on chain from this
      # repository (since 2026-08-21). A failed push here loses the ledger
      # line as well as the state — RUNBOOK failure mode 5.
      - name: Commit model state and the mark ledger
        run: |
          git config user.name "qx20-keeper"
          git config user.email "keeper@quadrix.finance"
          git add keeper/state.json keeper/nav-marks.jsonl
          git diff --cached --exit-code > /dev/null || git commit -m "keeper: qX20 NAV mark $(date -u +%Y-%m-%dT%H:%M)Z"
          # Rebase on main and push, up to five tries. Another commit can land on
          # main between checkout and push (ots is outside the keeper-key group;
          # basket-reconstitution and hand pushes also write to main), and a plain
          # push is then rejected and the record is lost. A rebase conflict means
          # another commit changed the same file: stop and fail, never resolve it
          # automatically and never force-push. An append-only file that only this
          # workflow appends to rebases cleanly, with its lines and their order
          # unchanged; two appends at the end of the same file conflict and fail.
          # A tracked file changed but not committed would also stop the rebase,
          # so it is checked first and reported as what it is.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::tracked files changed but not committed — the rebase cannot run. Stage them in this step. Nothing was pushed."
            git status --short --untracked-files=no
            git show --format='%H %s' HEAD -- keeper/nav-marks.jsonl keeper/state.json | tee record-push.patch
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "::warning::fetch attempt $i of 5 failed — trying again"
              sleep $((i * 5))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto main conflicted — another commit changed the same file. Nothing was pushed and nothing was overwritten. The local commit is printed below; apply it on main by hand."
              git show --format='%H %s' HEAD -- keeper/nav-marks.jsonl keeper/state.json | tee record-push.patch
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "::warning::push attempt $i of 5 rejected — trying again"
            sleep $((i * 5))
          done
          echo "::error::the mark ledger line and the model state could not be pushed to main after five tries. The local commit is printed below; apply it on main by hand."
          git show --format='%H %s' HEAD -- keeper/nav-marks.jsonl keeper/state.json | tee record-push.patch
          exit 1

      # A red badge is not an alert — nobody watches Actions at 3am. Filing an
      # issue emails every watcher with no extra secret to configure.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHAIN_OUTCOME: ${{ steps.post.outcome }}
        run: |
          set -uo pipefail
          # The chain step succeeded and only the record push failed: a re-run
          # would not restore the lost record, so this gets its own text and
          # its own label, which no later successful run closes.
          if [ "$CHAIN_OUTCOME" = "success" ]; then
            {
              echo "The qX20 NAV was **posted on chain**, but the record push to main failed — the mark ledger line and the model state are not on main."
              echo "**Do not re-run** — a re-run posts a new mark; it does not restore this one."
              echo "Apply the commit below on main by hand (the run log prints the same), then close this issue."
              echo
              echo "- run: $RUN_URL"
              echo
              echo '```diff'
              head -c 50000 record-push.patch 2>/dev/null || echo '(no commit saved — see the run log)'
              echo '```'
            } > alert.md
            gh label create record-push-failure --color d93f0b \
              --description "chain step done, record push failed; close by hand" 2>/dev/null || true
            gh issue create --title "qX20 NAV keeper: record push failed ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --label record-push-failure --body-file alert.md
            exit 0
          fi
          {
            echo "The qX20 NAV keeper failed. **The NAV on chain is now stale** —"
            echo "qX20 keeps quoting the last posted mark until this is resolved."
            echo
            echo "- run: $RUN_URL"
            echo "- runbook: \`keeper/RUNBOOK.md\`"
            echo
            echo '```'
            tail -n 40 keeper.log 2>/dev/null || echo '(no keeper output — the run failed before the keeper started)'
            echo '```'
          } > alert.md
          existing=$(gh issue list --label keeper-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file alert.md
          else
            gh label create keeper-failure --color b60205 --description "qX20 NAV keeper run failed" 2>/dev/null || true
            gh issue create --title "qX20 NAV keeper failing" --label keeper-failure --body-file alert.md
          fi

      # An open issue should mean "broken right now", not "broke once".
      - name: Resolve alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label keeper-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Keeper run succeeded — NAV posted. Closing."
          done
