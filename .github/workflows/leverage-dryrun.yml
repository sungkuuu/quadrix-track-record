name: leverage-dryrun

# Replays a leverage series (qBTC2X, qETH2X, qETH1.5X) from Binance bars in CI — by hand
# from the Actions tab, never scheduled — and recomputes it with
# scripts/verify.mjs. Output: keeper/dryrun/ as an artifact.
#
#   node keeper/leverage-index.mjs --index <i> --dry-run --replay FROM..TO \
#        [--throwaway-check n:T] [--throwaway-level bp:pct]
#
# index qvol replays the qVOL realized line instead (no throwaway values: its
# rule has none) and recomputes it with scripts/verify-vol.mjs against its
# rulebook JSON; the lines it would write are printed (date, value, variance,
# sha256 of the day's 1-minute bars):
#
#   node keeper/vol-index.mjs --line realized --dry-run --replay FROM..TO
#
# It NEVER commits, anchors or touches a vault: permissions are contents:
# read, KEEPER_PK is not passed (a step fails if one is in the environment),
# and a dry run neither reads a key nor sends a transaction. Throwaway values
# stand in for the empty tested values; every line they produce carries
# "rehearsal": "THROWAWAY n=… T=…" and fails verify.mjs without
# --allow-rehearsal. Inputs reach the shell through `env:` and are checked.
on:
  workflow_dispatch:
    inputs:
      index:
        description: 'qbtc2x | qeth2x | qeth15 | qvol'
        required: true
        type: choice
        options: [qbtc2x, qeth2x, qeth15, qvol]
      replay:
        description: 'FROM..TO (FROM = the replayed inception date, TO = the last line date), e.g. 2020-03-10..2020-03-13'
        required: true
        default: '2020-03-10..2020-03-13'
      throwaway_check:
        description: 'Optional n:T standing in for the empty tested values, e.g. 120:2.2 (labelled THROWAWAY on every line)'
        required: false
        default: ''
      throwaway_level:
        description: 'Optional costBp:ratePct standing in for an empty level.primary, e.g. 30:6'
        required: false
        default: ''

permissions:
  contents: read

# Its own group, not keeper-key: nothing here signs, and a pending run in
# keeper-key would displace a pending keeper run.
concurrency:
  group: leverage-dryrun
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDEX: ${{ inputs.index }}
      REPLAY: ${{ inputs.replay }}
      TCHECK: ${{ inputs.throwaway_check }}
      TLEVEL: ${{ inputs.throwaway_level }}
    steps:
      - name: Guard — valid inputs, no signing key
        run: |
          set -euo pipefail
          printf '%s' "$REPLAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::replay must be FROM..TO"; exit 1; }
          if [ "$TCHECK" != "" ] && ! printf '%s' "$TCHECK" | grep -Eq '^[0-9]+:[0-9]+(\.[0-9]+)?$'; then echo "::error::throwaway_check must be n:T"; exit 1; fi
          if [ "$TLEVEL" != "" ] && ! printf '%s' "$TLEVEL" | grep -Eq '^[0-9]+(\.[0-9]+)?:[0-9]+(\.[0-9]+)?$'; then echo "::error::throwaway_level must be bp:pct"; exit 1; fi
          if [ "${KEEPER_PK:-}" != "" ]; then echo "::error::KEEPER_PK is set — a dry run must not be able to sign"; exit 1; fi
          if [ "$INDEX" = "qvol" ] && { [ "$TCHECK" != "" ] || [ "$TLEVEL" != "" ]; }; then echo "::error::qvol takes no throwaway values"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Replay
        run: |
          set -o pipefail
          if [ "$INDEX" = "qvol" ]; then
            node keeper/vol-index.mjs --line realized --dry-run --replay "$REPLAY" 2>&1 | tee replay.log
            exit 0
          fi
          args=(--index "$INDEX" --dry-run --replay "$REPLAY")
          if [ "$TCHECK" != "" ]; then args+=(--throwaway-check "$TCHECK"); fi
          if [ "$TLEVEL" != "" ]; then args+=(--throwaway-level "$TLEVEL"); fi
          node keeper/leverage-index.mjs "${args[@]}" 2>&1 | tee replay.log

      - name: Recompute with verify.mjs
        run: |
          set -o pipefail
          if [ "$INDEX" = "qvol" ]; then
            node scripts/verify-vol.mjs --dir keeper/dryrun --line realized --rulebook keeper/rulebooks/qvol.json 2>&1 | tee verify.log
            exit 0
          fi
          node scripts/verify.mjs --dir keeper/dryrun --series "$INDEX" --recompute-only --allow-rehearsal 2>&1 | tee verify.log

      - name: qVOL lines (date, value, variance, sha256 of the day's 1-minute bars)
        if: ${{ !cancelled() && inputs.index == 'qvol' }}
        run: |
          set -o pipefail
          node --input-type=module -e "
            import fs from 'node:fs';
            const lines = fs.readFileSync('keeper/dryrun/record-qvol.jsonl', 'utf8').split('\n').filter((l) => l.trim());
            for (const l of lines.map((x) => JSON.parse(x))) console.log([l.seq, l.date, l.value, l.variance, l.source.day, l.source.rows, l.source.sha256, l.late ? 'late' : '-', l.shadow ? 'shadow' : '-'].join(' '));
          " | tee lines.txt
          { echo '## qVOL dry run — seq date value variance source.day rows source.sha256'; echo '```'; cat lines.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tripwire — nothing outside keeper/dryrun/ changed
        if: ${{ !cancelled() }}
        run: |
          changed=$(git status --porcelain --untracked-files=no -- . ':(exclude)keeper/dryrun' || true)
          if [ "$changed" != "" ]; then echo "::error::tracked files changed outside keeper/dryrun/:"; echo "$changed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: leverage-dryrun-${{ inputs.index }}-${{ github.run_id }}
          path: |
            keeper/dryrun/
            replay.log
            verify.log
            lines.txt
          retention-days: 30
