name: old-vaults-close

# Closes deposits on the two retired GIWA Sepolia testnet vaults that the
# redeployment leaves out, by hand from the Actions tab. Never scheduled.
# Redemptions stay open on both.
#
#   qDV     QuadrixVault (ERC-4626)  0xdf54c6b518335825947d90a941c706e26531a502
#           setDepositsPaused(true)
#   QBV v3  QuadrixBasketVault       0xa908c180be8d58f223a220da98dd71db0f0be45d
#           setPerTxCreateCap(0) — this deployment has no openCreation()
#
# keeper/close-old-vaults.mjs reads both vaults, checks that KEEPER_PK's
# address is the owner of each, skips a vault that is already closed, sends,
# and reads the value back at the receipt's block. Every transaction is
# appended to keeper/old-vaults.jsonl as soon as it is sent and again when it
# is mined; the commit step below runs even after a failed step.
#
# DRY RUN BY DEFAULT: nothing is sent unless `live` is ticked AND `confirm`
# is the word EXECUTE. A dry run reads, simulates from KEEPER_PK's address and
# prints the calldata; it writes nothing. Same `keeper-key` concurrency group
# as every other workflow that signs with KEEPER_PK. Inputs reach the shell
# through `env:` and are checked — never interpolated into a `run:` line.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Send transactions (otherwise dry run). Also needs confirm = EXECUTE.'
        type: boolean
        default: false
      confirm:
        description: 'Type EXECUTE to allow a live run'
        required: false
        default: ''

permissions:
  contents: write # commits keeper/old-vaults.jsonl to main

concurrency:
  group: keeper-key
  cancel-in-progress: false

env:
  # Fixed: the public GIWA Sepolia endpoint. Not an input — a different endpoint
  # could answer false vault state or keep a transaction to itself.
  RPC: https://sepolia-rpc.giwa.io

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      # The log written by a live run is committed to main; a run dispatched
      # on another ref would push it elsewhere. Main only, and main as it is
      # when the job starts (a queued or re-run job sees earlier lines).
      - name: Run only on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::old-vaults-close runs only on main (dispatched on $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide dry run or live
        id: mode
        env:
          LIVE: ${{ inputs.live }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$LIVE" = "true" ] && [ "$CONFIRM" = "EXECUTE" ]; then
            echo "flags=--live --confirm EXECUTE" >> "$GITHUB_OUTPUT"
            echo "::notice::LIVE — transactions will be sent from the keeper key"
          elif [ "$LIVE" = "true" ]; then
            echo "::error::live was ticked but confirm is not EXECUTE — refusing rather than running live by accident"
            exit 1
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN — nothing is sent"
          fi

      - name: Close deposits
        env:
          MODE_FLAGS: ${{ steps.mode.outputs.flags }}
          # Present in every run so a dry run checks the address a live run
          # would sign with; the script never prints a key.
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
        run: |
          set -o pipefail
          node keeper/close-old-vaults.mjs --rpc "$RPC" $MODE_FLAGS 2>&1 | tee close.log

      - name: Commit the log
        # Runs even after a failed step: a transaction that was sent is in
        # keeper/old-vaults.jsonl and must reach main.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "qx-old-vaults"
          git config user.email "keeper@quadrix.finance"
          [ -e keeper/old-vaults.jsonl ] && git add keeper/old-vaults.jsonl
          git diff --cached --quiet || git commit -m "old-vaults-close: close deposits $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          MODE_LABEL: ${{ steps.mode.outputs.flags != '' && 'LIVE' || 'dry run' }}
        run: |
          {
            echo "## old-vaults-close · $MODE_LABEL"
            echo
            echo '```'
            tail -n 60 close.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
