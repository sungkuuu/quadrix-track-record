name: ots

# Second time proof, independent of GIWA Sepolia: every record head hash and
# decision hash is also stamped with OpenTimestamps (Bitcoin). Runs after the
# daily record window; stamps anything new, upgrades pending proofs once the
# calendar has folded them into a Bitcoin block, commits trackrecord/ots/.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ots
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at run start, not the commit the schedule queued on: a
          # queued run can start hours later, after other commits.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp new hashes, upgrade pending proofs
        run: |
          node scripts/ots-stamp.mjs
          node scripts/ots-stamp.mjs --upgrade
          node scripts/ots-stamp.mjs --verify | tail -1
      - name: Commit proofs
        run: |
          git config user.name "qx-track-record"
          git config user.email "keeper@quadrix.finance"
          git add trackrecord/ots
          git diff --cached --quiet || git commit -m "ots: $(date -u +%Y-%m-%d) — $(node scripts/ots-stamp.mjs --verify | tail -1)"
          # Rebase on main and push, up to five tries. Another commit can land on
          # main between checkout and push (ots is outside the keeper-key group;
          # basket-reconstitution and hand pushes also write to main), and a plain
          # push is then rejected and the record is lost. A rebase conflict means
          # another commit changed the same file: stop and fail, never resolve it
          # automatically and never force-push. An append-only file that only this
          # workflow appends to rebases cleanly, with its lines and their order
          # unchanged; two appends at the end of the same file conflict and fail.
          for i in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "::warning::fetch attempt $i of 5 failed — trying again"
              sleep $((i * 5))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto main conflicted — another commit changed the same file. Nothing was pushed and nothing was overwritten. The local commit is printed below; apply it on main by hand."
              git show --format='%H %s' HEAD -- trackrecord/ots
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "::warning::push attempt $i of 5 rejected — trying again"
            sleep $((i * 5))
          done
          echo "::error::the proofs could not be pushed to main after five tries. The local commit is printed below; apply it on main by hand."
          git show --format='%H %s' HEAD -- trackrecord/ots
          exit 1
