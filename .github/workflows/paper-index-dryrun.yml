name: paper-index-dryrun

# Rehearses a paper-index reconstitution in CI — by hand from the Actions tab,
# never scheduled. It exists because the rehearsal needs live CoinGecko data
# and only this repository's Actions have the COINGECKO_API_KEY secret (the
# keyless endpoint answers 403; keeper/RUNBOOK.md "CoinGecko access").
#
# What it does, per git ref: copy the live books (keeper/state-{index}.json)
# and record chains (trackrecord/record-{index}.jsonl) into keeper/dryrun/,
# then run `node keeper/paper-index.mjs --index <i> --dry-run --as-of <as_of>`
# for qREV, qDEFI, qAI, Triens and Barbell, and upload keeper/dryrun/, the
# console logs and any keeper/pending-registry-*.json the basket leg wrote.
# With `ref_b`, the same runs against a second checkout, then
# scripts/dryrun-diff.mjs writes a JSON diff of members and eligibility per
# index. The ref_b side runs first and its keeper/cache/ is copied into this
# ref's checkout, so both sides read the same CoinGecko / DefiLlama responses
# and a difference between them is code, not data (a cache key one ref has
# and the other does not — e.g. a bumped CMC listing key — is still fetched).
#
# It NEVER commits, anchors or touches a basket contract:
#   - permissions are contents: read (a push would be refused);
#   - KEEPER_PK is not passed and a step fails if one is in the environment.
#     keeper/paper-index.mjs maybeAnchor() sends only with --anchor AND
#     KEEPER_PK; keeper/basket-mark.mjs markBasket() sets
#     canWrite = !!KEEPER_PK && !dryRun and builds no wallet client without it
#     (every setNav / setRefPrice is a "would ..." log line; the chain is only
#     read). --anchor is never passed;
#   - after the runs, a tracked file outside keeper/dryrun/ that changed, or a
#     log line that reports a sent transaction, fails the job.
#
# Not covered: qX20's monthly reconstitution (keeper/update-nav.mjs), which
# has no --dry-run/--as-of path of its own.
#
# Dispatch inputs reach the shell through `env:` and are quoted — never
# interpolated into a `run:` line — so an input cannot become a command.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Rehearsal date (YYYY-MM-DD), passed to --as-of'
        required: true
        default: '2026-10-01'
      ref_b:
        description: 'Optional second git ref (branch, tag or sha) to rehearse and diff against this one'
        required: false
        default: ''

permissions:
  contents: read

# Its own group, deliberately NOT keeper-key: nothing here signs, and a
# pending run in keeper-key would displace a pending keeper run.
concurrency:
  group: paper-index-dryrun
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AS_OF: ${{ inputs.as_of }}
      REF_B: ${{ inputs.ref_b }}
      INDEXES: qrev qdefi qai triens barbell
      # Optional; unset = the keyless public API. Sent as a request header by
      # keeper/paper-index.mjs, never in a URL or a log line.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - name: Guard — valid date, no signing key
        run: |
          set -euo pipefail
          if ! printf '%s' "$AS_OF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::as_of must be YYYY-MM-DD (got '$AS_OF')"; exit 1
          fi
          if [ -n "${KEEPER_PK:-}" ]; then
            echo "::error::KEEPER_PK is set in this job's environment — a rehearsal must not be able to sign"; exit 1
          fi
          if [ -z "${COINGECKO_API_KEY:-}" ]; then
            echo "::warning::COINGECKO_API_KEY is not set — CoinGecko will likely answer 403 and every screened reconstitution will be deferred"
          fi

      - uses: actions/checkout@v4
        with:
          path: a
          persist-credentials: false

      - uses: actions/checkout@v4
        if: ${{ inputs.ref_b != '' }}
        with:
          ref: ${{ inputs.ref_b }}
          path: b
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: a/package-lock.json

      - name: Install (this ref)
        run: npm ci
        working-directory: a

      - name: Install (ref_b)
        if: ${{ inputs.ref_b != '' }}
        run: npm ci
        working-directory: b

      - name: Write the rehearsal function
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rehearse.sh" <<'SH'
          # rehearse <checkout dir> <label>
          set -uo pipefail
          dir="$1"; label="$2"
          out="$GITHUB_WORKSPACE/out/$label"
          mkdir -p "$out/logs" "$out/live"
          cd "$dir"
          git rev-parse HEAD > "$out/ref.txt"
          echo "$label = $(git rev-parse --short HEAD) ($(git log -1 --format=%s | cut -c1-100))"
          # An unknown flag is ignored by the keeper's argument parser, so a
          # checkout without --as-of would silently rehearse TODAY instead.
          if ! grep -q "opt('--as-of'" keeper/paper-index.mjs; then
            echo "::error::$label: keeper/paper-index.mjs at $(git rev-parse --short HEAD) has no --as-of option — cannot rehearse $AS_OF"
            for ix in $INDEXES; do echo "$ix 2" >> "$out/exit-codes.txt"; done
            exit 1
          fi
          # Start every index from the live book and the live chain head, so
          # the rehearsed line is the one the next live run would append.
          rm -rf keeper/dryrun && mkdir -p keeper/dryrun
          for ix in $INDEXES; do
            if [ -f "keeper/state-$ix.json" ]; then
              cp "keeper/state-$ix.json" "keeper/dryrun/state-$ix.json"
              cp "keeper/state-$ix.json" "$out/live/state-$ix.json"
            fi
            if [ -f "trackrecord/record-$ix.jsonl" ]; then
              cp "trackrecord/record-$ix.jsonl" "keeper/dryrun/record-$ix.jsonl"
            fi
          done
          status=0
          for ix in $INDEXES; do
            echo "::group::$label $ix"
            node keeper/paper-index.mjs --index "$ix" --dry-run --as-of "$AS_OF" > "$out/logs/$ix.log" 2>&1
            rc=$?
            cat "$out/logs/$ix.log"
            echo "::endgroup::"
            echo "$ix $rc" >> "$out/exit-codes.txt"
            if [ "$rc" -ne 0 ]; then echo "::error::$label $ix exited $rc"; status=1; fi
          done
          cp -r keeper/dryrun "$out/dryrun"
          for f in keeper/pending-registry-*.json; do [ -e "$f" ] && cp "$f" "$out/"; done
          # Tripwires. (1) No tracked file outside keeper/dryrun/ changed.
          git status --porcelain --untracked-files=all > "$out/git-status.txt"
          changed=$(git status --porcelain --untracked-files=no -- . ':(exclude)keeper/dryrun' || true)
          if [ -n "$changed" ]; then
            echo "::error::$label: the rehearsal changed tracked files outside keeper/dryrun/:"; echo "$changed"; status=1
          fi
          # (2) No log line that reports a sent transaction (basket-mark
          # prints "tx=0x…" after a send; maybeAnchor prints "anchored on GIWA").
          if grep -nE 'tx=0x[0-9a-fA-F]{8}|anchored on GIWA' "$out"/logs/*.log; then
            echo "::error::$label: a log line reports a sent transaction"; status=1
          fi
          exit $status
          SH

      # ref_b first: its keeper/cache/ is then handed to this ref (see top).
      - name: Rehearse ref_b
        id: rehearse_b
        if: ${{ inputs.ref_b != '' }}
        continue-on-error: true
        run: bash "$RUNNER_TEMP/rehearse.sh" "$GITHUB_WORKSPACE/b" B

      - name: Share ref_b's market-data cache with this ref
        if: ${{ inputs.ref_b != '' }}
        run: |
          set -euo pipefail
          mkdir -p a/keeper/cache
          if [ -d b/keeper/cache ]; then cp -a b/keeper/cache/. a/keeper/cache/; fi
          ls a/keeper/cache | sed 's/^/  cache: /'

      - name: Rehearse this ref
        id: rehearse_a
        continue-on-error: true
        run: bash "$RUNNER_TEMP/rehearse.sh" "$GITHUB_WORKSPACE/a" A

      - name: Summarise and diff
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          args=(--a out/A --out out --as-of "$AS_OF")
          if [ -n "$REF_B" ] && [ -d out/B ]; then args+=(--b out/B); fi
          node a/scripts/dryrun-diff.mjs "${args[@]}" | tee out/digest.md
          {
            echo "## paper-index rehearsal — as of $AS_OF"
            echo
            cat out/digest.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: paper-index-dryrun-${{ inputs.as_of }}-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: Fail if a rehearsal failed
        if: ${{ steps.rehearse_a.outcome == 'failure' || steps.rehearse_b.outcome == 'failure' }}
        run: |
          echo "::error::rehearsal outcome — this ref: ${{ steps.rehearse_a.outcome }}, ref_b: ${{ steps.rehearse_b.outcome || 'not run' }}"
          exit 1
