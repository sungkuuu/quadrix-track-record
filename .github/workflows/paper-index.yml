name: paper-index

# Rules-only paper index levels (qREV, qDEFI). In force since the anchored
# inception decisions of 2026-09-16 (trackrecord/decisions/2026-09-16-*-paper-inception.md).
# Daily at 00:25 UTC, after the N1Q record at 00:10; manual dispatch kept for reruns.
# Barbell and Triens have steps below, disabled (`if: false`) until their own
# inception decisions are anchored — nothing of theirs runs on this schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: '25 0 * * *'

permissions:
  contents: write # appends trackrecord/record-{qrev,qdefi}.jsonl to main
  issues: write # failure alert, same pattern as track-record.yml

concurrency:
  group: keeper-key
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: qREV — compute and append today's record
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qrev --anchor 2>&1 | tee pi-qrev.log
        env:
          # Same keeper key as scripts/track-record.mjs. If it is not set as
          # a repo secret, paper-index.mjs logs a clear line and skips the
          # anchor step entirely — the record is still written and committed.
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: qDEFI — compute and append today's record
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qdefi --anchor 2>&1 | tee pi-qdefi.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      # ------------------------------------------------------------------
      # Barbell and Triens — the two sleeve indexes. DISABLED ON PURPOSE.
      #
      # `if: false` because neither index is in force: both rulebooks are
      # drafts, `inception` is null in keeper/rulebooks/{barbell,triens}.json,
      # and nothing may be appended to trackrecord/record-{barbell,triens}.jsonl
      # until an owner decision anchors an inception date for each. Turning
      # them on is: anchor the decision, fill `inception` in the rulebook,
      # delete the `if: false` line from that step, add the step's files to
      # the commit step below.
      #
      # They belong in THIS job, not a second workflow: every step here signs
      # with the same KEEPER_PK, and the `keeper-key` concurrency group above
      # is what keeps two runs from racing into the same nonce (the 2026-09-18
      # failure). The anchor send inside paper-index.mjs retries on a nonce
      # error for the same reason. A separate workflow would be outside the
      # group and would reintroduce exactly that race.
      # ------------------------------------------------------------------
      - name: Barbell — compute and append today's record
        if: false # not in force until the inception decision is anchored (owner)
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index barbell --anchor 2>&1 | tee pi-barbell.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: Triens — compute and append today's record
        if: false # not in force until the inception decision is anchored (owner)
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index triens --anchor 2>&1 | tee pi-triens.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: qX20 — mark the basket vault from keeper/state.json (no record append)
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qx20 2>&1 | tee pi-qx20.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: Commit records
        run: |
          git config user.name "qx-paper-index"
          git config user.email "keeper@quadrix.finance"
          # Barbell/Triens files are deliberately absent from this list: their
          # steps are disabled, so there is nothing of theirs to commit. Add
          # trackrecord/record-{barbell,triens}.jsonl, the matching anchors
          # files and keeper/state-{barbell,triens}.json here on the same day
          # their steps are enabled.
          git add trackrecord/record-qrev.jsonl trackrecord/anchors-qrev.jsonl \
                  trackrecord/record-qdefi.jsonl trackrecord/anchors-qdefi.jsonl \
                  keeper/state-qrev.json keeper/state-qdefi.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "paper-index: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # Same failure-alert pattern as track-record.yml: a missed day is
      # simply absent from the record, never backfilled, so it earns the
      # same visible, standing alert.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          {
            echo "The paper-index run failed. A missed day is simply absent from"
            echo "record-{qrev,qdefi}.jsonl — it is never backfilled."
            echo
            echo "- run: $RUN_URL"
            echo
            echo '```'
            echo '--- qREV ---'
            tail -n 40 pi-qrev.log 2>/dev/null || echo '(no output — failed before the qREV step ran)'
            echo '--- qDEFI ---'
            tail -n 40 pi-qdefi.log 2>/dev/null || echo '(no output — failed before the qDEFI step ran)'
            echo '```'
          } > alert.md
          existing=$(gh issue list --label paper-index-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file alert.md
          else
            gh label create paper-index-failure --color b60205 \
              --description "paper-index (qREV/qDEFI) run failed" 2>/dev/null || true
            gh issue create --title "paper-index run failing" \
              --label paper-index-failure --body-file alert.md
          fi

      - name: Resolve alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label paper-index-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "paper-index run succeeded. Closing."
          done
