name: paper-index

# Rules-only paper index levels (qREV, qDEFI). In force since the anchored
# inception decisions of 2026-09-16 (trackrecord/decisions/2026-09-16-*-paper-inception.md).
# Daily at 00:25 UTC, after the N1Q record at 00:10; manual dispatch kept for reruns.
# Barbell and Triens: in force since their anchored inception decisions of
# 2026-09-22 (trackrecord/decisions/2026-09-22-{barbell,triens}-paper-inception.md).
# qBTC2X (leverage stage A): from 2026-10-13, once its inception decision is
# anchored; until then the leg reports NOT IN FORCE and exits 0. qETH2X is held
# (owner, 2026-10-06): its step below does not run. qETH1.5X (series id qeth15):
# from 2026-10-16, once its inception decision is anchored; same guard.
on:
  workflow_dispatch:
  schedule:
    - cron: '25 0 * * *'

permissions:
  contents: write # appends trackrecord/record-{qrev,qdefi}.jsonl to main
  issues: write # failure alert, same pattern as track-record.yml

concurrency:
  group: keeper-key
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      # main as it is when this run STARTS: a run that waited in the keeper-key queue must see the lines the
      # run before it pushed, or it writes and anchors the same day again (red team F08). Do not dispatch by
      # hand while a scheduled run is queued; never "Re-run jobs" (it re-runs the old commit's steps).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: deps
        run: npm ci

      # Each leg below writes its own record line, state and anchor, and only
      # then marks its basket vault (keeper/paper-index.mjs markAfterRecord). A
      # leg that exits 1 — a failed basket mark included — does not skip the
      # legs after it: they are independent records, so every later leg runs
      # on `!cancelled()` as long as the dependencies installed. The job is
      # still marked failed and "Alert on failure" still opens the issue.
      - name: qREV — compute and append today's record
        id: qrev
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qrev --anchor 2>&1 | tee pi-qrev.log
        env:
          # Same keeper key as scripts/track-record.mjs. If it is not set as
          # a repo secret, paper-index.mjs logs a clear line and skips the
          # anchor step entirely — the record is still written and committed.
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          # Optional (2026-09-29). Unset = the keyless public API, as before;
          # see keeper/RUNBOOK.md "CoinGecko access". Never echoed: it is
          # sent as a request header, not in a URL.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: qDEFI — compute and append today's record
        id: qdefi
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qdefi --anchor 2>&1 | tee pi-qdefi.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # ------------------------------------------------------------------
      # Barbell and Triens — the two sleeve indexes, in force since 2026-09-22.
      #
      # They belong in THIS job, not a second workflow: every step here signs
      # with the same KEEPER_PK, and the `keeper-key` concurrency group above
      # is what keeps two runs from racing into the same nonce (the 2026-09-18
      # failure). The anchor send inside paper-index.mjs retries on a nonce
      # error for the same reason. A separate workflow would be outside the
      # group and would reintroduce exactly that race.
      # ------------------------------------------------------------------
      - name: Barbell — compute and append today's record
        id: barbell
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index barbell --anchor 2>&1 | tee pi-barbell.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Triens — compute and append today's record
        id: triens
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index triens --anchor 2>&1 | tee pi-triens.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # ------------------------------------------------------------------
      # qAI — AI sector index, in force since 2026-09-22
      # (trackrecord/decisions/2026-09-22-qai-paper-inception.md). Same
      # KEEPER_PK, same `keeper-key` concurrency group.
      # ------------------------------------------------------------------
      - name: qAI — compute and append today's record
        id: qai
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qai --anchor 2>&1 | tee pi-qai.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # ------------------------------------------------------------------
      # Leverage stage A — qBTC2X, qETH2X and qETH1.5X (keeper/leverage-index.mjs).
      # The level is computed from Binance spot bars of every CLOSED UTC day
      # since the last line (a late run writes the same level and marks the
      # line `late`), one line per UTC day, independently recomputed by
      # scripts/verify.mjs before it is appended, anchored as
      # `qxpi-<index>:`, and only then the testnet mark vault follows
      # (keeper/leverage-vaults.json; skipped while its address is null).
      # Same KEEPER_PK, same `keeper-key` group, same schedule: no new key,
      # scheduler or concurrency group.
      #
      # The guard is in the leg, not here: it writes nothing and exits 0
      # ("NOT IN FORCE") until the inception decision
      # <date>-<index>-paper-inception is in trackrecord/decisions.jsonl
      # and pins keeper/rulebooks/<index>.json, and until that date 00:00 UTC
      # (the rulebook JSON's inception.date: qBTC2X 2026-10-13, qETH1.5X 2026-10-16).
      # An ANCHORED decision that the rulebook JSON no longer matches is a
      # refusal (exit 2): restore the JSON to the pinned bytes.
      # qBTC2X opens on 2026-10-13. qETH2X is held (owner, 2026-10-06): it
      # does not open on that day, its step is switched off below, and turning
      # it on needs its own inception decision. qETH1.5X opens on 2026-10-16.
      # ------------------------------------------------------------------
      - name: qBTC2X — compute the closed UTC days since the last line, anchor, mark
        id: qbtc2x
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # A step time limit fails only this step; "Commit records" below still runs and the five paper series keep
        # their day (red team F09). Each Binance request is cut at 60 s with four tries; a normal run takes under
        # a few minutes, a model liquidation's 46 marks a few more.
        timeout-minutes: 20
        run: |
          set -o pipefail
          node keeper/leverage-index.mjs --index qbtc2x --anchor 2>&1 | tee pi-qbtc2x.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: qETH2X — held (owner, 2026-10-06), not run
        # Held: ETH 2x does not open on 2026-10-13. `false` keeps the step from running whatever the leg's own guard
        # says; switching it back on is a commit with its own inception decision.
        if: ${{ false }}
        # A step time limit fails only this step; "Commit records" below still runs and the five paper series keep
        # their day (red team F09). Each Binance request is cut at 60 s with four tries; a normal run takes under
        # a few minutes, a model liquidation's 46 marks a few more.
        timeout-minutes: 20
        run: |
          set -o pipefail
          node keeper/leverage-index.mjs --index qeth2x --anchor 2>&1 | tee pi-qeth2x.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: qETH1.5X — compute the closed UTC days since the last line, anchor, mark
        id: qeth15
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # As qBTC2X: a step time limit fails only this step, and "Commit records" below still runs. Until the
        # inception decision 2026-10-16-qeth15-paper-inception is anchored the leg writes nothing and exits 0
        # (NOT IN FORCE). From 2026-10-22 a testnet mark vault follows this level (keeper/leverage-vaults.json, entry qeth15;
        # decision 2026-10-22-qeth15-mark-vault): the leg marks it after it writes and anchors the day's line.
        timeout-minutes: 20
        run: |
          set -o pipefail
          node keeper/leverage-index.mjs --index qeth15 --anchor 2>&1 | tee pi-qeth15.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}

      - name: qX20 — mark the basket vault from keeper/state.json (no record append)
        id: qx20
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -o pipefail
          node keeper/paper-index.mjs --index qx20 2>&1 | tee pi-qx20.log
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # The qX20 daily-close series the site charts (keeper/qx20-daily.jsonl) is
      # read back from chain by this script. It was never in a job, so the
      # series stopped at 2026-09-15 while the site's freshness gate (added
      # 2026-09-22) only learned to watch it on 2026-09-23. Rebuilt daily here;
      # a rebuild is idempotent (the file is rewritten, sorted).
      - name: qX20 — rebuild the daily-close series from chain
        id: qx20daily
        if: ${{ !cancelled() }}
        run: node scripts/qx20-marks-from-chain.mjs

      - name: Commit records
        id: commit
        # Runs even when a later step failed: a record that was computed and
        # anchored must reach main. On 2026-09-21 the qX20 mark step reverted
        # and this step was skipped, so the qREV/qDEFI lines for that day were
        # anchored on chain but never committed — a permanent gap.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "qx-paper-index"
          git config user.email "keeper@quadrix.finance"
          git add trackrecord/record-qrev.jsonl trackrecord/anchors-qrev.jsonl \
                  trackrecord/record-qdefi.jsonl trackrecord/anchors-qdefi.jsonl \
                  trackrecord/record-barbell.jsonl trackrecord/anchors-barbell.jsonl \
                  trackrecord/record-triens.jsonl trackrecord/anchors-triens.jsonl \
                  keeper/state-qrev.json keeper/state-qdefi.json \
                  keeper/state-barbell.json keeper/state-triens.json \
                  trackrecord/record-qai.jsonl trackrecord/anchors-qai.jsonl \
                  keeper/state-qai.json keeper/qx20-daily.jsonl 2>/dev/null || true
          # The basket work orders (keeper/basket-mark.mjs part (c) writes
          # keeper/pending-registry-{index}.json on a reconstitution day) and
          # reconstitution plans (keeper/plans/), and the last-known-good
          # CoinGecko snapshot (keeper/cg-snapshot/, refreshed on a live pull,
          # read when CoinGecko is unreachable). Absent on most days, so each
          # is staged on its own: one pathspec that matches nothing makes the
          # `git add` above stage nothing at all. Never fatal — the records
          # above must still be committed.
          # The leverage series (keeper/leverage-index.mjs) are absent until
          # their inception lines, so they are staged the same way.
          for f in keeper/pending-registry-*.json keeper/plans keeper/cg-snapshot \
                   trackrecord/record-qbtc2x.jsonl trackrecord/anchors-qbtc2x.jsonl keeper/marks-qbtc2x.jsonl \
                   trackrecord/record-qeth2x.jsonl trackrecord/anchors-qeth2x.jsonl keeper/marks-qeth2x.jsonl \
                   trackrecord/record-qeth15.jsonl trackrecord/anchors-qeth15.jsonl keeper/marks-qeth15.jsonl; do
            if [ -e "$f" ]; then git add -- "$f" || echo "::warning::could not stage $f"; fi
          done
          git diff --cached --quiet || git commit -m "paper-index: $(date -u +%Y-%m-%d)"
          # Rebase on main and push, up to five tries. Another commit can land on
          # main between checkout and push (ots is outside the keeper-key group;
          # basket-reconstitution and hand pushes also write to main), and a plain
          # push is then rejected and the record is lost. A rebase conflict means
          # another commit changed the same file: stop and fail, never resolve it
          # automatically and never force-push. An append-only file that only this
          # workflow appends to rebases cleanly, with its lines and their order
          # unchanged; two appends at the end of the same file conflict and fail.
          # A tracked file changed but not committed would also stop the rebase,
          # so it is checked first and reported as what it is.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::tracked files changed but not committed — the rebase cannot run. Stage them in this step. Nothing was pushed."
            git status --short --untracked-files=no
            git show --format='%H %s' HEAD | tee record-push.patch
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "::warning::fetch attempt $i of 5 failed — trying again"
              sleep $((i * 5))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto main conflicted — another commit changed the same file. Nothing was pushed and nothing was overwritten. The local commit is printed below; apply it on main by hand."
              git show --format='%H %s' HEAD | tee record-push.patch
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "::warning::push attempt $i of 5 rejected — trying again"
            sleep $((i * 5))
          done
          echo "::error::the paper-index records could not be pushed to main after five tries. The local commit is printed below; apply it on main by hand."
          git show --format='%H %s' HEAD | tee record-push.patch
          exit 1

      # Same failure-alert pattern as track-record.yml: a missed day is
      # simply absent from the record, never backfilled, so it earns the
      # same visible, standing alert.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSH_OUTCOME: ${{ steps.commit.outcome }}
          OTHER_FAILED: ${{ steps.deps.outcome == 'failure' || steps.qrev.outcome == 'failure' || steps.qdefi.outcome == 'failure' || steps.barbell.outcome == 'failure' || steps.triens.outcome == 'failure' || steps.qai.outcome == 'failure' || steps.qbtc2x.outcome == 'failure' || steps.qeth15.outcome == 'failure' || steps.qx20.outcome == 'failure' || steps.qx20daily.outcome == 'failure' }}
        run: |
          set -uo pipefail
          # The record push failed: the lines this run computed (and anchored,
          # where the step anchors) are not on main, and a re-run would not
          # restore them. Same split as index-nav-keeper.yml and track-record.yml:
          # its own text and its own label, which no later successful run closes.
          # If a compute step failed as well, the general alert below also runs.
          if [ "$PUSH_OUTCOME" = "failure" ]; then
            {
              echo "The record push to main failed — the paper-index records this run computed (and anchored on chain, where the step anchors) are not on main."
              echo "**Do not re-run** — a re-run computes and anchors again; it does not restore these lines."
              echo "Apply the commit below on main by hand (the run log prints the same), then close this issue."
              echo
              echo "- run: $RUN_URL"
              echo
              echo '```diff'
              head -c 50000 record-push.patch 2>/dev/null || echo '(no commit saved — see the run log)'
              echo '```'
            } > alert.md
            gh label create record-push-failure --color d93f0b \
              --description "chain step done, record push failed; close by hand" 2>/dev/null || true
            gh issue create --title "paper-index: record push failed ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --label record-push-failure --body-file alert.md
            [ "$OTHER_FAILED" = "true" ] || exit 0
          fi
          {
            echo "The paper-index run failed. A missed day is simply absent from"
            echo "record-{qrev,qdefi,barbell,triens,qai}.jsonl — it is never backfilled."
            echo "qBTC2X, qETH2X and qETH1.5X write a missed day late, from that day's bars."
            echo
            echo "- run: $RUN_URL"
            echo
            echo '```'
            echo '--- qREV ---'
            tail -n 40 pi-qrev.log 2>/dev/null || echo '(no output — failed before the qREV step ran)'
            echo '--- qDEFI ---'
            tail -n 40 pi-qdefi.log 2>/dev/null || echo '(no output — failed before the qDEFI step ran)'
            echo '--- Barbell ---'
            tail -n 40 pi-barbell.log 2>/dev/null || echo '(no output — failed before the Barbell step ran)'
            echo '--- Triens ---'
            tail -n 40 pi-triens.log 2>/dev/null || echo '(no output — failed before the Triens step ran)'
            echo '--- qAI ---'
            tail -n 40 pi-qai.log 2>/dev/null || echo '(no output — failed before the qAI step ran)'
            echo '--- qBTC2X ---'
            tail -n 40 pi-qbtc2x.log 2>/dev/null || echo '(no output — failed before the qBTC2X step ran)'
            echo '--- qETH2X ---'
            tail -n 40 pi-qeth2x.log 2>/dev/null || echo '(held — the qETH2X step does not run)'
            echo '--- qETH1.5X ---'
            tail -n 40 pi-qeth15.log 2>/dev/null || echo '(no output — failed before the qETH1.5X step ran)'
            echo '--- qX20 basket mark ---'
            tail -n 40 pi-qx20.log 2>/dev/null || echo '(no output — failed before the qX20 step ran)'
            echo '```'
          } > alert.md
          existing=$(gh issue list --label paper-index-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file alert.md
          else
            gh label create paper-index-failure --color b60205 \
              --description "paper-index (qREV/qDEFI) run failed" 2>/dev/null || true
            gh issue create --title "paper-index run failing" \
              --label paper-index-failure --body-file alert.md
          fi

      - name: Resolve alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label paper-index-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "paper-index run succeeded. Closing."
          done
